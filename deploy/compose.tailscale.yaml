# Adds remote access over Tailscale to compose.yaml; see "Remote access
# with Tailscale" in docs/deploy-truenas.md. Render both together:
#   docker compose --env-file FILLED.env -f deploy/compose.yaml \
#     -f deploy/compose.tailscale.yaml config --no-path-resolution
services:
  tailscale:
    image: tailscale/tailscale:stable
    # Tailscale serves Sloplex at https://<hostname>.<tailnet>.ts.net to your
    # tailnet only, passing requests to it over the app's own network. The
    # two containers restart independently.
    depends_on: [sloplex]
    user: "${SLOPLEX_UID:?Choose a non-root NAS UID}:${SLOPLEX_GID:?Choose its non-root GID}"
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Tailscale needs to own its state folder. Without that it never logs in
    # and only says "permission denied" in passing, so check first and say
    # what to fix.
    entrypoint:
      - /bin/sh
      - -c
      - |
        d=/var/lib/tailscale
        s=$$d/tailscaled.state
        if ! { [ -w "$$d" ] && [ -x "$$d" ] &&
               { [ "$$(stat -c %a "$$d")" = 700 ] || chmod 700 "$$d"; } &&
               { [ ! -e "$$s" ] || { [ -r "$$s" ] && [ -w "$$s" ]; }; }; } 2>/dev/null; then
          echo "Tailscale cannot use its state dataset (mounted at $$d)." >&2
          echo "Make user $$(id -u) and group $$(id -g) its owner, with full access, then restart the app." >&2
          exit 1
        fi
        printf '%s' "$$SLOPLEX_SERVE" > /tmp/serve.json
        exec /usr/local/bin/containerboot
    environment:
      TS_HOSTNAME: "${SLOPLEX_TS_HOSTNAME:-sloplex}"
      # A one-off auth key for the first login. Without one, this
      # container's log shows a login link, valid for a minute at a time.
      TS_AUTHKEY: "${SLOPLEX_TS_AUTHKEY:-}"
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /tmp/tailscaled.sock
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /tmp/serve.json
      # Tailscale fills in ${TS_CERT_DOMAIN} and ${REQUEST_URI}. Plain
      # http:// is sent on to https://. Funnel, which would publish Sloplex
      # on the internet, stays off.
      SLOPLEX_SERVE: >-
        {"TCP":{"80":{"HTTP":true},"443":{"HTTPS":true}},
        "Web":{"$${TS_CERT_DOMAIN}:80":{"Handlers":{"/":{"Redirect":"https://$${TS_CERT_DOMAIN}$${REQUEST_URI}"}}},
        "$${TS_CERT_DOMAIN}:443":{"Handlers":{"/":{"Proxy":"http://sloplex:32400"}}}},
        "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}
    volumes:
      - type: bind
        source: "${SLOPLEX_TS_STATE:?Absolute path to a dedicated dataset for Tailscale's state}"
        target: /var/lib/tailscale
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
