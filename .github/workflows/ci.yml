name: CI

on:
  push:
    branches: ["**"] # release.yml runs these checks for tags
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build
        run: go build ./cmd/sloplex

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Playwright
        working-directory: test/e2e
        run: npm install && npx playwright install --with-deps chromium
      - name: Browser suites
        run: test/e2e/run.sh
        env:
          E2E_WORK: ${{ runner.temp }}/sloplex-e2e
      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            ${{ runner.temp }}/sloplex-e2e/shots
            ${{ runner.temp }}/sloplex-e2e/*.log

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release tag rules
        run: python3 -m unittest discover -s .github/scripts
      - name: Build CPU image (local only, no registry publication)
        run: docker build --build-arg VERSION="${GITHUB_SHA}" -t sloplex:ci .
      - name: Exercise Compose security, media tools, auth and persistence
        run: python3 test/container/smoke.py sloplex:ci
